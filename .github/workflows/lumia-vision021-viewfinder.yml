name: LUMIA VISION-02.1 Camera Viewfinder and Local Multimodal Full Regression

on:
  push:
    branches:
      - feature/lumia-vision021-camera-viewfinder-20261107
  pull_request:
    branches:
      - feature/lumia-vision02-owner-camera-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumia-vision021-viewfinder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 release-line commit
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4 release-line commit
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Brain provider contracts
        run: npm run certify:brain

      - name: Voice Gate contracts
        run: npm run certify:voice-gate

      - name: ECC agent harness contract
        run: node scripts/certify-lumia-agent-harness.mjs

      - name: ECC context budget contract
        run: node scripts/certify-lumia-context-budget.mjs

      - name: First-audio low-latency segmentation (VL-01 and ASUS VL-07)
        run: npx tsx scripts/certify-first-audio-chunk.ts

      - name: VL-02 Voice latency policy certification
        run: npx tsx scripts/certify-lumia-voice-latency-vl02.ts

      - name: VL-03 Adaptive turn-taking certification
        run: npx tsx scripts/certify-lumia-adaptive-turns-vl03.ts

      - name: VL-04 Progressive MP3 audio transport certification
        run: npx tsx scripts/certify-lumia-tts-stream-vl04.ts

      - name: VL-05 Owner-gated WebRTC session contract
        run: node scripts/certify-lumia-realtime-vl05.mjs

      - name: VL-05B Realtime lifecycle and PIN lockout hardening
        run: node scripts/certify-lumia-realtime-vl05b.mjs

      - name: VL-06 Privacy-safe Realtime turnaround metrics
        run: npx tsx scripts/certify-lumia-realtime-metrics-vl06.ts

      - name: VL-06 Local acoustic lab and exclusive microphone contract
        run: npx tsx scripts/certify-lumia-acoustic-lab-vl06.ts

      - name: VL-06 Shared mic lease and Windows device recovery
        run: npx tsx scripts/certify-lumia-mic-lease-vl06.ts

      - name: VL-06 Whisper repeated acoustic-label regression
        run: npx tsx scripts/certify-lumia-whisper-background-vl06.ts

      - name: VL-06 Safe Windows preflight contract
        run: node scripts/certify-lumia-windows-preflight-vl06.mjs

      - name: VL-06 Offline preflight CLI smoke
        run: node scripts/lumia-voice-preflight.mjs --json

      - name: AV-01 Face GLB optical profile and classic fallback
        run: npx tsx scripts/certify-lumia-avatar-face-av01.ts

      - name: ASUS face fit and TTS-only LUMIA spoken name (PRON-01)
        run: npx tsx scripts/certify-lumia-speech-pronunciation.ts

      - name: TL-01 Conversation timeline and 40s no-response diagnostics
        run: npx tsx scripts/certify-lumia-conversation-timeline-tl01.ts

      - name: VA-01 Kokoro resident opt-in, legacy fallback and audible phrase latency
        run: |
          npx tsx scripts/certify-lumia-kokoro-resident-va01.ts
          python3 -m py_compile bridge/runtime/kokoro/resident.py

      - name: VA-02 ASUS bounded local WAV recovery and no paid rescue
        run: npx tsx scripts/certify-lumia-local-playback-recovery-va02.ts

      - name: CG-01 Detect repeated previous answers to unrelated voice questions
        run: node scripts/certify-lumia-stale-answer-cg01.mjs

      - name: RC-01 IA local STT and opt-in streaming Ollama reply
        run: npx tsx scripts/certify-lumia-voice-rc01.ts

      - name: RA-01 14s phrase gap model vs Kokoro vs playback attribution
        run: npx tsx scripts/certify-lumia-gap-attribution-ra01.ts

      - name: MI-02 Local installed-model counting and follow-up questions
        run: node scripts/certify-lumia-model-inventory-mi02.ts

      - name: WR-01 Delayed Whisper guard to standby wake recovery
        run: npx tsx scripts/certify-lumia-guard-to-wake-wr01.ts

      - name: WR-02 Local command capture grace and Voice Focus regressions
        run: npx tsx scripts/certify-voice-focus.ts

      - name: LC-01 ASUS long local question capture and turn assembly
        run: npx tsx scripts/certify-lumia-long-question-lc01.ts

      - name: VQ-01 Rapid multipart Spanish speech and authorized Whisper turn retention
        run: npx tsx scripts/certify-lumia-complex-voice-vq01.ts

      - name: NF-01 Local near-field acoustic focus and legacy isolation
        run: npx tsx scripts/certify-lumia-near-field-focus-nf01.ts

      - name: SR-01 ASUS natural voices restoration and Spanish everyday ASR regression
        run: npx tsx scripts/certify-lumia-spanish-reception-sr01.ts

      - name: UX-01 Native typing, image attachment, push and continuous input modes
        run: npx tsx scripts/certify-lumia-input-modes-ux01.ts

      - name: UX-02 One-row translucent glass dock and original input wiring
        run: npx tsx scripts/certify-lumia-glass-dock-ux02.ts

      - name: LT-01 Explicit local multilingual translation and isolation
        run: node scripts/certify-lumia-translate-lt01.mjs

      - name: LT-02Q Translation quality guard for wrong-language and mixed output
        run: node scripts/certify-lumia-translation-quality-lt02q.mjs

      - name: LT-03 Translation semantic fidelity, negation, ordinals and equipment
        run: node scripts/certify-lumia-translation-fidelity-lt03.mjs

      - name: LT-04Q Third local plain translation retry and specific error classes
        run: node scripts/certify-lumia-translation-rescue-lt04q.mjs

      - name: LT-05 Offline WhatsApp voice-note import, multilingual Whisper and translation
        run: node scripts/certify-lumia-translate-audio-lt05.mjs

      - name: LT-05B Owner-controlled audio transcript corrections
        run: npx tsx scripts/certify-lumia-translate-review-lt05b.ts

      - name: LT-05C Editor click, focus and pass-through hologram regression
        run: npx tsx scripts/certify-lumia-translate-review-click-lt05c.ts

      - name: LT-05D Original audio timing versus manual Qwen retranslation
        run: npx tsx scripts/certify-lumia-translate-timing-lt05d.ts

      - name: STT-02 Offline Spanish WER comparison contract
        run: node scripts/certify-stt02-benchmark.mjs

      - name: UX-03 Ring-clear response rail and mobile readable fallback
        run: npx tsx scripts/certify-lumia-halo-ux03.ts
      - name: UX-04 Holographic circular transcript layout
        run: npx tsx scripts/certify-lumia-halo-ux04.ts

      - name: UX-04B Mirrored circle geometry and visible-text layout regressions
        run: npx tsx scripts/certify-lumia-halo-ux04b.ts

      - name: UX-04C Safe outer ring radius and real text-line collision guard
        run: npx tsx scripts/certify-lumia-halo-ux04c.ts

      - name: VI-01 Owner-selected photograph in local multimodal Ollama
        run: npx tsx scripts/certify-lumia-visual-input-vi01.ts

      - name: VISION-02 owner-authorized still camera, no persistent image, privacy and voice isolation
        run: npx tsx scripts/certify-lumia-vision02-camera.ts

      - name: AV-01B Owner face GLB / SHA-256 check or explicit publication pending
        run: node scripts/certify-lumia-avatar-asset.mjs

      - name: WAKE-02 Whisper phonetic wake verification
        run: node scripts/certify-lumia-wake-phonetics-02.mjs

      - name: SKILL-01 runtime abilities and memory readiness contract
        run: node scripts/certify-lumia-skill-registry-skill01.mjs

      - name: RC-04 truthful translation capabilities verification
        run: node scripts/certify-lumia-translation-awareness-rc04.mjs

      - name: RC-03 grounded weather and capabilities verification
        run: node scripts/certify-lumia-grounded-claims-rc03.mjs

      - name: RC-02 response relevance and safe recovery
        run: node scripts/certify-lumia-response-relevance-rc02.mjs

      - name: PH-01 Portal Head VRM regression
        run: node scripts/certify-lumia-head-ph01.mjs

      - name: PH-02 eyes, head movement, optical and lip-sync regression
        run: npx tsx scripts/certify-lumia-head-ph02.ts

      - name: PH-03 original Motion R8 procedural body and 17 private-clips contract
        run: npx tsx scripts/certify-lumia-motion-r8-portal-ph03.ts

      - name: PH-03 Windows installer verification against synthetic verified ZIP
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/INSTALAR_LUMIA_MOTION_R8_BODY.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          ./scripts/certify-lumia-motion-r8-installer.ps1

      - name: PH-04 face-native views and manual R8 command certification
        run: npx tsx scripts/certify-lumia-avatar-presence-ph04.ts

      - name: PH-04.2 ASUS voice traces, independent VRM clones and bounded R8 posture
        run: npx tsx scripts/certify-lumia-avatar-ph042.ts

      - name: PH-04.3 full-body limb regression and bottom-bar avatar menu
        run: npx tsx scripts/certify-lumia-ph043-fullbody-dock.ts

      - name: PH-04.4 face default, view command precedence and leftmost composer picker
        run: npx tsx scripts/certify-lumia-ph044-face-native-leftpicker.ts

      - name: PH-04.5 17 FBX guided narrative, facial expressions and safe interruption
        run: npx tsx scripts/certify-lumia-ph045-guided-demo.ts

      - name: PH-04.6 native 17-FBX durations and truthful animation capabilities
        run: npx tsx scripts/certify-lumia-ph046-real-fbx-duration.ts

      - name: PH-04.7 ASUS single gestures, menu, clapping and No head tracks
        run: npx tsx scripts/certify-lumia-ph047-owner-motions.ts

      - name: PH-04.8 walk in place vs forward vs circle with actual mixer clock
        run: npx tsx scripts/certify-lumia-ph048-walk-paths.ts

      - name: VISION-02.1 Live camera preview, exact sent JPEG and privacy controls
        run: npx tsx scripts/certify-lumia-vision021-viewfinder.ts

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint