name: LUMIA Meeting Intelligence Certification

on:
  push:
    branches:
      - feature/lumia-meeting-intelligence-v1
      - feature/lumia-mi02-speaker-tracking-ui
      - feature/lumia-mi03-speaker-consolidation
      - feature/lumia-mi04-short-turn-recovery
  pull_request:
    branches:
      - feature/lumia-vg03-acoustic-intelligence

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Meeting Intelligence contracts
        run: npm run certify:meeting

      - name: LUMIA architecture regression
        run: npm run certify:lumia-architecture

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
