name: LUMIA VI-03.2B Fresh Vision Voice
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/ui/LumiaCameraViewfinder.tsx'
      - 'src/lib/vision-voice-grounding-vi032b.ts'
      - 'scripts/certify-lumia-vision032b-fresh-voice.ts'
      - 'INICIAR_LUMIA_ASUS_VISION_REVISAR_VI032B.cmd'
      - '.github/workflows/lumia-vision032b-fresh-voice.yml'
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # VI-04A stacked feature: enforce face-count regression on the proven voice pipeline.
      - run: npx tsx scripts/certify-lumia-vision040a-faces.ts
      - run: npx tsx scripts/certify-lumia-vision032b-fresh-voice.ts
      - run: npx tsx scripts/certify-lumia-vision032-sentinel-cpu.ts
      - run: npx tsx scripts/certify-lumia-vision031-active-session.ts
      - run: npm run build
