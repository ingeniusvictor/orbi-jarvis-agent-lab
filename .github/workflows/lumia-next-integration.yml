name: LUMIA NEXT - cumulative avatar and vision gate
on:
  pull_request:
    paths:
      - 'LUMIA_NEXT_MANIFEST.json'
      - 'LUMIA_PLATFORM_MATRIX.json'
      - 'LUMIA_IMPROVEMENTS_LEDGER.json'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'docs/lumia-convergence/42-LUMIA-CONTROL-MEJORAS-20261124.md'
      - 'docs/lumia-convergence/43-TRANSICION-NEXT-A-ACTUALIZACIONES-20261124.md'
      - 'scripts/certify-lumia-improvements-ledger.mjs'
      - 'README.md'
      - 'docs/lumia-convergence/41-LUMIA-UNIFICADA-TRES-ENTORNOS-20261124.md'
      - 'scripts/certify-lumia-platform-matrix.mjs'
      - 'INICIAR_LUMIA_ASUS_NEXT_QA.cmd'
      - 'scripts/lumia-next-local-voice-qa.mjs'
      - 'scripts/certify-lumia-next-integration.mjs'
      - 'src/App.tsx'
      - 'src/scene/LumiaPortalHead.tsx'
      - 'src/scene/lumia-head/**'
      - 'src/scene/lumia-motion-r8/avatar-presence-ph04.ts'
      - 'src/lib/vision-audit-vi041.ts'
      - 'src/lib/vision-same-frame-vi042a.ts'
      - 'src/lib/vision-count-grounding-vi042b.ts'
      - 'scripts/certify-lumia-vision042b-count-grounding.ts'
      - 'scripts/certify-lumia-vision042b2-natural-scene.ts'
      - 'scripts/certify-lumia-vision042b3-body-focus.ts'
      - 'scripts/certify-lumia-vision05a-pose.ts'
      - 'scripts/certify-lumia-vision05a1-pose-diagnostics.ts'
      - 'scripts/instalar-modelo-pose-vi05.ps1'
      - 'src/lib/vision-pose-vi05.ts'
      - 'src/lib/vision-pose-worker-vi05.ts'
      - '.gitignore'
      - 'src/lib/vision-face-worker-vi04.ts'
      - 'scripts/certify-lumia-vision042a-same-frame.ts'
      - 'src/lib/vision-active-vi031.ts'
      - 'src/lib/vision-voice-grounding-vi032b.ts'
      - 'scripts/certify-lumia-vision032b-fresh-voice.ts'
      - 'src/ui/LumiaCameraViewfinder.tsx'
      - 'vite.config.ts'
      - 'scripts/certify-lumia-vision040a-wasm-route.mjs'
      - '.github/workflows/lumia-next-integration.yml'
  workflow_dispatch:
jobs:
  cumulative:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # CI runners have no CUDA GPU. onnxruntime-node upstream v1.21.0
      # CUDA tarball returned 404 on Ubuntu, so follow installer-advertised
      # no-CUDA path ONLY here. ASUS / original runtime remain untouched.
      - run: npm ci --onnxruntime-node-install-cuda=skip
      - run: node scripts/certify-lumia-next-integration.mjs
      - run: node scripts/certify-lumia-platform-matrix.mjs
      - run: node scripts/certify-lumia-improvements-ledger.mjs
      - run: node scripts/certify-lumia-vision040a-wasm-route.mjs
      - run: npx tsx scripts/certify-lumia-vq04-natural-face.ts
      - run: npx tsx scripts/certify-lumia-vq05-speech-expressions.ts
      - run: npx tsx scripts/certify-lumia-vq051-facial-contrast.ts
      - run: npx tsx scripts/certify-lumia-vision041-audit.ts
      - run: npx tsx scripts/certify-lumia-vision042a-same-frame.ts
      - run: npx tsx scripts/certify-lumia-vision042b-count-grounding.ts
      - run: npx tsx scripts/certify-lumia-vision042b2-natural-scene.ts
      - run: npx tsx scripts/certify-lumia-vision042b3-body-focus.ts
      - run: npx tsx scripts/certify-lumia-vision05a-pose.ts
      - run: npx tsx scripts/certify-lumia-vision05a1-pose-diagnostics.ts
      - run: npx tsx scripts/certify-lumia-vision040a-faces.ts
      - run: npx tsx scripts/certify-lumia-vision032b-fresh-voice.ts
      - run: npx tsx scripts/certify-lumia-vision032-sentinel-cpu.ts
      - run: npm run lint
      - run: npm run build
