name: LUMIA PH-01 - Portal Head POC
on:
  push:
    branches:
      - feat/lumia-ph01-portal-head-rc03-20261103
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Compile portal
        run: npm run build
      - name: Lint certificado RC-03 + integracion PH-01
        run: npm run lint
      - name: Certificar regresiones RC-02 y RC-03
        run: |
          node scripts/certify-lumia-response-relevance-rc02.mjs
          node scripts/certify-lumia-grounded-claims-rc03.mjs
      - name: Certify PH01 head routing and voice events
        run: node scripts/certify-lumia-head-ph01.mjs
      - name: ASUS real voice commands - model inventory and avatar routing regression
        run: |
          node scripts/certify-amr-model-runtime.mjs
          npx tsx scripts/certify-lumia-avatar-presence-ph04.ts
      - name: Verify legacy avatar still certified
        run: node scripts/certify-lumia-avatar-asset.mjs
      - name: Reject private VRM and Mixamo assets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(vrm|fbx|bundle)$'; then
            echo "ERROR: assets privados versionados"
            exit 1
          fi
