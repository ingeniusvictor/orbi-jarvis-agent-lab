name: LUMIA PH-00 - baseline portal
on:
  push:
    branches:
      - docs/lumia-portal-motion-convergence-20261101
  pull_request:

permissions:
  contents: read

jobs:
  portal-static-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Compilar portal existente
        run: npm run build
      - name: Verificar control VRM y modo de voz
        run: |
          npm run certify:vrm
          npm run certify:vrm:runtime
      - name: Certificar recurso GLB anterior
        run: node scripts/certify-lumia-avatar-asset.mjs
